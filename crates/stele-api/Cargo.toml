[package]
name = "stele-api"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Adds [`cors_layer`], a thin wrapper over `tower-http`'s CORS middleware.
cors = ["tower-http/cors"]

[dependencies]
async-graphql = "7"
async-graphql-axum = "7"
axum = "0.8"
futures-util = "0.3"
pg_query = "6"
stele-checkpoint = { path = "../stele-checkpoint" }
stele-schema = { path = "../stele-schema" }
stele-store = { path = "../stele-store" }
stele-types = { path = "../stele-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tower-http = { version = "0.6", features = ["limit"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
