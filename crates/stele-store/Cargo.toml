[package]
name = "stele-store"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
stele-checkpoint = { path = "../stele-checkpoint" }
stele-schema = { path = "../stele-schema" }
stele-types = { path = "../stele-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
